name: API smoke test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: Test cancellation and graceful shutdown
        run: go test ./api/main.go ./api/main_test.go
      - name: Build image
        run: docker build -t convert-api ./api
      - name: Test conversion
        run: |
          docker run -d --name api -p 127.0.0.1:8080:8080 -e CONVERT_API_KEY=test convert-api
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/health && break || sleep 1; done
          curl -fsS -H 'X-API-Key: test' 'http://127.0.0.1:8080/formats?extension=docx' | python3 -c 'import json,sys; assert "pdf" in json.load(sys.stdin)["targets"]'
          echo 'Hello from Convert API' > input.txt
          test "$(curl -s -o /dev/null -w '%{http_code}' -F file=@input.txt -F format=pdf http://127.0.0.1:8080/convert)" = 401
          curl -fsS -H 'X-API-Key: test' -F file=@input.txt -F format=pdf http://127.0.0.1:8080/convert -o output.pdf
          head -c 5 output.pdf | grep -q '%PDF-'
          curl -fsS -H 'X-API-Key: test' -F file=@input.txt -F format=docx http://127.0.0.1:8080/convert -o input.docx
          curl -fsS -H 'X-API-Key: test' -F file=@input.docx -F format=md http://127.0.0.1:8080/convert -o output.md
          grep -q 'Hello from Convert API' output.md
          tar -czf sample.tar.gz input.txt
          curl -fsS -H 'X-API-Key: test' -F file=@sample.tar.gz -F format=zip http://127.0.0.1:8080/convert -o sample.zip
          python3 -c 'import zipfile; assert zipfile.ZipFile("sample.zip").read("input.txt").strip() == b"Hello from Convert API"'
          curl -fsS -H 'X-API-Key: test' -F file=@sample.tar.gz -F format=folder http://127.0.0.1:8080/convert -o extracted.zip
          python3 -c 'import zipfile; z=zipfile.ZipFile("extracted.zip"); assert z.read(z.namelist()[0]).strip() == b"Hello from Convert API"'
          printf 'Before\n\n![](figure_0.png)\n\nAfter\n' > with-image.md
          curl -fsS -H 'X-API-Key: test' -F file=@with-image.md -F 'assets=@docs/media/page-home-en.png;filename=figure_0.png' -F format=tex http://127.0.0.1:8080/convert -o with-image.zip
          python3 -c 'import zipfile; z=zipfile.ZipFile("with-image.zip"); t=z.read("input.tex").decode(); assert t.index("Before") < t.index("input_files/figure_0.png") < t.index("After")'
          docker exec api /opt/filee/engines/ffmpeg/bin/ffmpeg -v error -f lavfi -i color=c=blue:s=64x48:r=5 -t 1 -c:v libx264 -pix_fmt yuv420p -y /tmp/video.mp4
          docker cp api:/tmp/video.mp4 video.mp4
          curl -fsS -H 'X-API-Key: test' -F file=@video.mp4 -F format=gif http://127.0.0.1:8080/convert -o video.gif
          python3 -c 'assert open("video.gif", "rb").read(6) in (b"GIF87a", b"GIF89a")'
      - name: Test an active request during container shutdown
        run: |
          mkdir -p "$RUNNER_TEMP/grace-check"
          chmod 777 "$RUNNER_TEMP/grace-check"
          cp input.txt output.pdf "$RUNNER_TEMP/grace-check/"
          cat > "$RUNNER_TEMP/grace-check/mock-cli" <<'EOF'
          #!/bin/sh
          touch /grace-check/started
          sleep 4
          cp /grace-check/output.pdf "$6/output.pdf"
          EOF
          chmod 755 "$RUNNER_TEMP/grace-check/mock-cli"
          docker run -d --name graceful -p 127.0.0.1:8081:8080 -v "$RUNNER_TEMP/grace-check:/grace-check" -e FILEE_CLI=/grace-check/mock-cli convert-api
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8081/health && break || sleep 1; done
          curl -fsS -F "file=@$RUNNER_TEMP/grace-check/input.txt" -F format=pdf http://127.0.0.1:8081/convert -o "$RUNNER_TEMP/grace-check/result.pdf" &
          request_pid=$!
          for i in $(seq 1 50); do test -f "$RUNNER_TEMP/grace-check/started" && break || sleep 0.1; done
          test -f "$RUNNER_TEMP/grace-check/started"
          docker stop --time 10 graceful
          wait "$request_pid"
          cmp "$RUNNER_TEMP/grace-check/output.pdf" "$RUNNER_TEMP/grace-check/result.pdf"
