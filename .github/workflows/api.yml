name: API smoke test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t convert-api ./api
      - name: Test conversion
        run: |
          docker run -d --name api -p 127.0.0.1:8080:8080 -e CONVERT_API_KEY=test convert-api
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/health && break || sleep 1; done
          curl -fsS -H 'X-API-Key: test' 'http://127.0.0.1:8080/formats?extension=docx' | python3 -c 'import json,sys; assert "pdf" in json.load(sys.stdin)["targets"]'
          echo 'Hello from Convert API' > input.txt
          test "$(curl -s -o /dev/null -w '%{http_code}' -F file=@input.txt -F format=pdf http://127.0.0.1:8080/convert)" = 401
          curl -fsS -H 'X-API-Key: test' -F file=@input.txt -F format=pdf http://127.0.0.1:8080/convert -o output.pdf
          head -c 5 output.pdf | grep -q '%PDF-'
          curl -fsS -H 'X-API-Key: test' -F file=@input.txt -F format=docx http://127.0.0.1:8080/convert -o input.docx
          curl -fsS -H 'X-API-Key: test' -F file=@input.docx -F format=md http://127.0.0.1:8080/convert -o output.md
          grep -q 'Hello from Convert API' output.md
          tar -czf sample.tar.gz input.txt
          curl -fsS -H 'X-API-Key: test' -F file=@sample.tar.gz -F format=zip http://127.0.0.1:8080/convert -o sample.zip
          python3 -c 'import zipfile; assert zipfile.ZipFile("sample.zip").read("input.txt").strip() == b"Hello from Convert API"'
          curl -fsS -H 'X-API-Key: test' -F file=@sample.tar.gz -F format=folder http://127.0.0.1:8080/convert -o extracted.zip
          python3 -c 'import zipfile; z=zipfile.ZipFile("extracted.zip"); assert z.read(z.namelist()[0]).strip() == b"Hello from Convert API"'
