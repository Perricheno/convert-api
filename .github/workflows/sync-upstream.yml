name: Sync Filee source
on:
  workflow_dispatch:
  schedule:
    - cron: '37 5 * * 1'
permissions:
  actions: write
  contents: write
  pull-requests: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge upstream and propose a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote add upstream https://github.com/KnifeLemon/Filee.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo 'Filee source is already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin automation/sync-filee >/dev/null; then
            git fetch origin +refs/heads/automation/sync-filee:refs/remotes/origin/automation/sync-filee
          fi
          git switch -C automation/sync-filee
          git merge --no-edit upstream/main
          git push --force-with-lease origin automation/sync-filee
          if ! gh pr list --head automation/sync-filee --state open --json number --jq '.[0].number' | grep -q .; then
            gh pr create --head automation/sync-filee --base main --title 'Sync upstream Filee source' --body 'Review upstream changes, resolve any conflicts, and run the API smoke test before merging.'
          fi
          gh workflow run api.yml --ref automation/sync-filee
